services:
  redis:
    image: redis:7-alpine
    container_name: pmd-redis
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - pmd-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  hbase:
    build: .
    image: pmd-hbase
    container_name: pmd-hbase
    hostname: pmd-hbase
    ports:
      - "9090:9090"
      - "16010:16010"
    volumes:
      - pmd-hbase:/data
    healthcheck:
      test: ["CMD-SHELL", "echo \"exists 'hbase:meta'\" | hbase shell -n 2>/dev/null | grep -q 'does exist'"]
      interval: 10s
      timeout: 30s
      retries: 18
      start_period: 20s

volumes:
  pmd-redis:
    name: pmd-redis
  pmd-hbase:
    name: pmd-hbase
